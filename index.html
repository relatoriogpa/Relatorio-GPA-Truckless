<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b57d0">
<title>Relatório GPA Truckless B 2.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#202124}
header{background:#0b57d0;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}
header h1{font-size:20px;margin:0}
header .subtitle {display: flex; justify-content: space-between; margin:5px 0 0; font-size:13px; opacity:.9;}
main{max-width:720px;margin:auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #00000012}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input,select,textarea{width:100%;border:1px solid #c8ccd1;border-radius:9px;padding:11px;font-size:16px;font-family:inherit;background:#fff}
textarea{min-height:120px;resize:vertical}
button{width:100%;border:0;border-radius:10px;padding:13px;margin-top:10px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#0b57d0;color:white}.secondary{background:#e8eefc;color:#0b57d0}.danger{background:#fce8e6;color:#b3261e}
#preview{white-space:pre-wrap;line-height:1.5;font-size:15px}
.small{font-size:12px;color:#666;margin-top:8px}

.time-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

#executantesBox {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 8px;
  border: 1px solid #c8ccd1;
  border-radius: 9px;
  padding: 12px;
  background: #fff;
  margin-bottom: 8px;
}
#executantesBox label {
  display: flex;
  align-items: center;
  font-weight: 400;
  margin: 0;
  cursor: pointer;
}
#executantesBox input[type="checkbox"] {
  width: auto;
  margin: 0 8px 0 0;
  cursor: pointer;
  transform: scale(1.1); 
}
</style>
</head>
<body>
<header>
  <h1>Relatório de Atividade GPA</h1>
  <div class="subtitle">
    <span>Versão 2.0</span>
    <span>by Josiel Macedo</span>
  </div>
</header>
<main>
<div class="card">
<label>Fase *</label>
<select id="fase">
  <option value="">Selecione a fase</option>
  <option>Truckless</option>
  <option>Estéril</option>
</select>

<label>Data</label>
<input id="data" type="text" readonly>

<div id="localContainer" style="display:none;">
<label>Local *</label>
<select id="sistema" disabled>
  <option value="">Selecione o local</option>
</select>
</div>

<label>Equipamento *</label><input id="equipamento" placeholder="Ex.: TR1080KS01 / TR1082KS02 M01">
<label>Falha *</label><input id="falha" placeholder="Descreva a falha">

<label>OM *</label><input id="om" type="text" inputmode="numeric" maxlength="12" oninput="this.value = this.value.replace(/\D/g, '')" placeholder="Exatamente 12 números">

<div class="time-row">
  <div>
    <label>Horário Inicial *</label>
    <input id="horaInicio" type="text" inputmode="numeric" maxlength="5" placeholder="00:00" oninput="formatarHora(this)">
  </div>
  <div>
    <label>Horário Final *</label>
    <input id="horaFim" type="text" inputmode="numeric" maxlength="5" placeholder="00:00" oninput="formatarHora(this)">
  </div>
</div>

<div id="executantesContainer" style="display:none;">
<label>Executantes *</label>
<div id="executantesBox"></div>
<input id="executanteManual" placeholder="Adicionar 1º nome manualmente (opcional)" style="margin-bottom:8px;">
<input id="executanteManual2" placeholder="Adicionar 2º nome manualmente (opcional)">
</div>
</div>

<div class="card">
<label>Descrição da Ocorrência *</label>
<textarea id="ocorrencia" placeholder="Descreva o que ocorreu..."></textarea>

<label>Ações Realizadas *</label>
<textarea id="acao" placeholder="Descreva os testes, diagnóstico e serviços executados..."></textarea>

<label>Observações (Opcional)</label>
<textarea id="observacoes" placeholder="Informações adicionais (opcional)..."></textarea>
</div>

<div class="card">
<button class="primary" onclick="gerar(true)">GERAR RELATÓRIO</button>

<div id="actionButtons" style="display: none;">
  <button class="secondary" onclick="salvarPDF()">BAIXAR EM PDF</button>
  <button class="secondary" onclick="copiar()">COPIAR TEXTO</button>
  <button class="secondary" onclick="compartilharWhatsApp()">COMPARTILHAR VIA WHATSAPP</button>
  <button class="secondary" onclick="compartilharEmail()">COMPARTILHAR VIA E-MAIL</button>
</div>

<button class="danger" onclick="limpar()">LIMPAR</button>
</div>

<div class="card">
<label>Pré-visualização</label>
<div id="preview">Preencha os campos e toque em “GERAR RELATÓRIO”.</div>
<div class="small">Os campos com asterisco (*) são obrigatórios.</div>
</div>
</main>

<script>
const ids=['data','fase','sistema','equipamento','falha','om','horaInicio','horaFim','executanteManual','executanteManual2','ocorrencia','acao','observacoes'];
const $=id=>document.getElementById(id);

function formatarHora(input) {
  let v = input.value.replace(/\D/g, '');
  if (v.length > 4) v = v.slice(0, 4);
  if (v.length > 2) {
    v = v.slice(0, 2) + ':' + v.slice(2);
  }
  input.value = v;
}

function ocultarBotoesAcao() {
  if($('actionButtons')) $('actionButtons').style.display = 'none';
  $('preview').innerHTML = "<em>Modificações detectadas. Toque em 'GERAR RELATÓRIO' novamente.</em>";
}

document.querySelectorAll('input, textarea, select').forEach(el => {
  el.addEventListener('input', ocultarBotoesAcao);
  el.addEventListener('change', ocultarBotoesAcao);
});

function dataAtualBR(){
  const d=new Date();
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}

function atualizarData(){ 
  $('data').value = dataAtualBR(); 
}

function atualizarLocais() {
  const fase = val('fase');
  const container = $('localContainer');
  const select = $('sistema');

  if (!fase) {
    container.style.display = 'none';
    select.disabled = true;
    select.innerHTML = '<option value="">Selecione o local</option>';
    return;
  }

  container.style.display = 'block';
  select.disabled = false;

  const locaisTruckless = [
    'Sistema 01',
    'Sistema 02',
    'Sistema 03',
    'Sistema 04',
    'BSM',
    'Compactos',
    'Pilha 01',
    'Pilha 02'
  ];

  const locaisEsteril = [
    '5ª Britagem',
    'PY01',
    'PY02',
    'Overland',
    'Plantas Móveis'
  ];

  const locais = fase === 'Estéril' ? locaisEsteril : locaisTruckless;
  const valorAtual = select.value;

  select.innerHTML = '<option value="">Selecione o local</option>';
  locais.forEach(local => {
    const option = document.createElement('option');
    option.value = local;
    option.textContent = local;
    select.appendChild(option);
  });

  if (locais.includes(valorAtual)) {
    select.value = valorAtual;
  }
}

atualizarData();
atualizarLocais();

function atualizarExecutantes() {
  const fase = val('fase');
  const container = $('executantesContainer');
  const box = $('executantesBox');

  if (!fase) {
    container.style.display = 'none';
    box.innerHTML = '';
    return;
  }

  container.style.display = 'block';

  const executantesTruckless = [
    'Anderson', 'Beatriz', 'Danilo', 'Jarlon', 'Josiel',
    'Keyssiane', 'Lopes', 'Magno', 'Marcelo', 'Simenea'
  ];

  const executantesEsteril = [
    'Alex', 'Altevir', 'Cleiton', 'Fabrício', 'Igor', 'Jekianne',
    'Laysa', 'Lindoso', 'Lindoso', 'Marisvaldo', 'Myllena',
    'Paulo Max', 'Pedro', 'Roberto', 'Vitória'
  ];

  const nomes = fase === 'Estéril' ? executantesEsteril : executantesTruckless;

  // Preserva os nomes previamente selecionados que ainda existirem na nova lista.
  const selecionadosAntes = obterExecutantesArray();

  box.innerHTML = '';
  nomes.forEach(nome => {
    const label = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.name = 'exec';
    checkbox.value = nome;
    checkbox.checked = selecionadosAntes.includes(nome);
    label.appendChild(checkbox);
    label.appendChild(document.createTextNode(' ' + nome));
    box.appendChild(label);
  });
}

$('fase').addEventListener('change', function() {
  atualizarLocais();
  atualizarExecutantes();
});
atualizarExecutantes();

function obterExecutantesArray() {
  const nomes=[...document.querySelectorAll('input[name="exec"]:checked')].map(e=>e.value);
  const manual = $('executanteManual').value.trim();
  const manual2 = $('executanteManual2').value.trim();
  
  if(manual) nomes.push(manual);
  if(manual2) nomes.push(manual2); 
  return nomes;
}

function executantesSelecionados(){
  const nomes = obterExecutantesArray();
  return nomes.length ? nomes.join('; ') : '';
}

function val(id){
  return $(id) && $(id).value.trim() ? $(id).value.trim() : '';
}

function calcularDuracao(hInicio, hFim) {
  const [h1, m1] = hInicio.split(':').map(Number);
  const [h2, m2] = hFim.split(':').map(Number);
  
  let minutosInicio = h1 * 60 + m1;
  let minutosFim = h2 * 60 + m2;
  
  let diff = minutosFim - minutosInicio;
  if (diff < 0) {
    diff += 24 * 60; // caso passe da meia-noite
  }
  
  const horas = Math.floor(diff / 60);
  const minutos = diff % 60;
  
  return String(horas).padStart(2, '0') + ':' + String(minutos).padStart(2, '0');
}

function validarCampos() {
  const fase = val('fase');
  const sis = val('sistema');
  const eq = val('equipamento');
  const falha = val('falha');
  const omVal = val('om');
  const hInicio = val('horaInicio');
  const hFim = val('horaFim');
  const ocorrencia = val('ocorrencia');
  const acao = val('acao');
  const execs = obterExecutantesArray();

  if(!fase || !sis || !eq || !falha || !omVal || !hInicio || !hFim || !ocorrencia || !acao || execs.length === 0) {
    alert("Por favor, preencha todos os campos obrigatórios (*).");
    return false;
  }

  if(omVal.length !== 12) {
    alert("O campo OM é obrigatório e deve conter exatamente 12 números.");
    return false;
  }

  // Regex permite de 00:00 até 23:59 e também 24:00
  const regexHora = /^(([01]\d|2[0-3]):([0-5]\d)|24:00)$/;
  if(!regexHora.test(hInicio)) {
    alert("Formato de hora inválido no campo 'Horário Inicial'. Use o formato 24:00 (ex: 08:30 ou 24:00).");
    $('horaInicio').focus();
    return false;
  }
  if(!regexHora.test(hFim)) {
    alert("Formato de hora inválido no campo 'Horário Final'. Use o formato 24:00 (ex: 17:00 ou 24:00).");
    $('horaFim').focus();
    return false;
  }

  return true;
}

function gerar(isClick = false){
  if(isClick && !validarCampos()) {
    return false;
  }

  if(!validarCampos()) return false;

  atualizarData();
  
  const duracaoCalculada = calcularDuracao(val('horaInicio'), val('horaFim'));

  const obsRaw = val('observacoes');
  let obsTexto = '';
  let obsPreview = '';
  if(obsRaw) {
    obsTexto = '\n\n*Observações:*\n' + obsRaw;
    obsPreview = '<br><br><strong>Observações:</strong><br>' + obsRaw.replace(/\n/g,'<br>');
  }

  const tituloRelatorio = val('fase') === 'Truckless'
    ? 'Relatório de Atividade - GPA Truckless B'
    : val('fase') === 'Estéril'
      ? 'Relatório de Atividade - GPA Estéril B'
      : 'Relatório de Atividade GPA';

  const texto=`*${tituloRelatorio}*

*Data:* ${val('data')}
*Local:* ${val('sistema')}
*Equipamento:* ${val('equipamento')}
*Falha:* ${val('falha')}
*OM:* ${val('om')}
*Horário Inicial:* ${val('horaInicio')}
*Horário Final:* ${val('horaFim')}
*Duração:* ${duracaoCalculada}
*Executantes:* ${executantesSelecionados()}

*Descrição da Ocorrência:*
${val('ocorrencia')}

*Ações Realizadas:*
${val('acao')}${obsTexto}`;

  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const ocorr=esc(val('ocorrencia')).replace(/\n/g,'<br>');
  const acao=esc(val('acao')).replace(/\n/g,'<br>');

  $('preview').innerHTML =
    '<div><strong>'+esc(tituloRelatorio)+'</strong></div><br>' +
    '<strong>Data:</strong> '+esc(val('data'))+'<br>' +
    '<strong>Local:</strong> '+esc(val('sistema'))+'<br>' +
    '<strong>Equipamento:</strong> '+esc(val('equipamento'))+'<br>' +
    '<strong>Falha:</strong> '+esc(val('falha')) + '<br>' +
    '<strong>OM:</strong> '+esc(val('om')) + '<br>' +
    '<strong>Horário Inicial:</strong> '+esc(val('horaInicio')) + '<br>' +
    '<strong>Horário Final:</strong> '+esc(val('horaFim')) + '<br>' +
    '<strong>Duração:</strong> '+duracaoCalculada + '<br>' +
    '<strong>Executantes:</strong> '+esc(executantesSelecionados())+'<br><br>' +
    '<strong>Descrição da Ocorrência:</strong><br>'+ocorr+'<br><br>' +
    '<strong>Ações Realizadas:</strong><br>'+acao + obsPreview;

  salvarCampos();
  
  if(isClick && $('actionButtons')) {
    $('actionButtons').style.display = 'block';
  }
  
  return texto;
}

function salvarCampos(){
  const dados={};
  ids.forEach(id=>{
    if($(id)) dados[id]=$(id).value;
  });
  dados.executantesSelecionados=[...document.querySelectorAll('input[name="exec"]:checked')].map(e=>e.value);
  localStorage.setItem('relatorioGPA16B_Final',JSON.stringify(dados));
}

function salvarPDF() {
  const textoValido = gerar(false);
  if(!textoValido) return;

  if (!window.jspdf || !window.jspdf.jsPDF) {
    alert('A biblioteca de PDF ainda não foi carregada. Verifique sua conexão com a internet e tente novamente.');
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  
  const dataStr = val('data');
  const omVal = val('om');
  const duracaoCalculada = calcularDuracao(val('horaInicio'), val('horaFim'));
  
  doc.setFont("helvetica", "bold");
  doc.setFontSize(16);
  const tituloRelatorio = val('fase') === 'Truckless'
    ? 'Relatório de Atividade - GPA Truckless B'
    : val('fase') === 'Estéril'
      ? 'Relatório de Atividade - GPA Estéril B'
      : 'Relatório de Atividade GPA';
  doc.text(tituloRelatorio, 15, 20);
  
  doc.setFontSize(12);
  let y = 30;
  
  const addLinha = (label, valor) => {
    doc.setFont("helvetica", "bold");
    doc.text(label + ": ", 15, y);
    let offset = doc.getTextWidth(label + ": ");
    doc.setFont("helvetica", "normal");
    doc.text(valor, 15 + offset, y);
    y += 8; 
  };
  
  addLinha("Data", val('data'));
  addLinha("Local", val('sistema'));
  addLinha("Equipamento", val('equipamento'));
  addLinha("Falha", val('falha'));
  addLinha("OM", omVal);
  addLinha("Horário Inicial", val('horaInicio'));
  addLinha("Horário Final", val('horaFim'));
  addLinha("Duração", duracaoCalculada);
  
  y += 2;
  doc.setFont("helvetica", "bold");
  doc.text("Executantes:", 15, y);
  y += 6;
  doc.setFont("helvetica", "normal");
  const execs = doc.splitTextToSize(executantesSelecionados(), 180);
  doc.text(execs, 15, y);
  y += execs.length * 6 + 4;
  
  const addSecao = (titulo, conteudo) => {
    if (y > 270) { doc.addPage(); y = 20; }
    doc.setFont("helvetica", "bold");
    doc.text(titulo + ":", 15, y);
    y += 5;
    
    doc.setFont("helvetica", "normal");
    const linhas = doc.splitTextToSize(conteudo, 180); 
    
    for(let i = 0; i < linhas.length; i++) {
      if (y > 280) { doc.addPage(); y = 20; } 
      doc.text(linhas[i], 15, y);
      y += 7;
    }
    y += 4; 
  };
  
  addSecao("Descrição da Ocorrência", val('ocorrencia'));
  addSecao("Ações Realizadas", val('acao'));
  
  const obsRaw = val('observacoes');
  if(obsRaw) {
    addSecao("Observações", obsRaw);
  }
  
  const nomeArquivo = `Relatorio_OM_${omVal}_${dataStr.replace(/\//g, '-')}.pdf`;
  doc.save(nomeArquivo);
}

async function copiar(){
  const texto = gerar(false);
  if(!texto) return; 

  if(navigator.clipboard && window.isSecureContext){
    try{
      await navigator.clipboard.writeText(texto);
      alert('Relatório copiado com sucesso!');
      return;
    }catch(e){
      console.log("Clipboard API falhou, tentando método tradicional.");
    }
  }

  const area = document.createElement('textarea');
  area.value = texto;
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();

  try {
    document.execCommand('copy');
    alert('Relatório copiado com sucesso!');
  } catch (e) {
    alert('Seu navegador não permitiu copiar automaticamente.');
  }
  
  document.body.removeChild(area);
}

async function compartilharWhatsApp(){
  const texto = gerar(false);
  if(!texto) return;

  const textoCodificado = encodeURIComponent(texto);

  if(navigator.share && /mobile|android|iphone/i.test(navigator.userAgent)){
    try{
      await navigator.share({
        title: val('fase') === 'Truckless'
          ? 'Relatório de Atividade - GPA Truckless B'
          : val('fase') === 'Estéril'
            ? 'Relatório de Atividade - GPA Estéril B'
            : 'Relatório de Atividade GPA',
        text: texto
      });
      return;
    }catch(e){
      console.log("Compartilhamento nativo cancelado.");
    }
  }

  const url = 'https://wa.me/?text=' + textoCodificado;
  const novaJanela = window.open(url, '_blank');
  if (!novaJanela) {
    window.location.href = url;
  }
}

function compartilharEmail(){
  const texto = gerar(false);
  if(!texto) return;

  const assunto='Relatório de Atividade GPA Truckless B - OM ' + val('om');
  const url='mailto:?subject='+encodeURIComponent(assunto)+'&body='+encodeURIComponent(texto);
  window.location.href=url;
}

function limpar(){
  if(confirm("Tem certeza que deseja limpar todos os campos?")) {
    ids.forEach(id=>{ if($(id)) $(id).value = ''; });
    document.querySelectorAll('input[name="exec"]').forEach(e=>e.checked = false);
    localStorage.removeItem('relatorioGPA16B_Final');
    $('preview').innerHTML = "Preencha os campos e toque em “GERAR RELATÓRIO”.";
    if($('actionButtons')) $('actionButtons').style.display = 'none';
    atualizarData();
  }
}

try{
  const s=JSON.parse(localStorage.getItem('relatorioGPA16B_Final')||'null');
  if(s){
    ids.forEach(id=>{
      if(id!=='data' && id!=='sistema' && s[id]!==undefined && $(id)) $(id).value=s[id];
    });
    atualizarLocais();
    atualizarExecutantes();
    if(s.sistema && $('sistema')) $('sistema').value=s.sistema;
    if(Array.isArray(s.executantesSelecionados)){
      document.querySelectorAll('input[name="exec"]').forEach(e=>{
        e.checked = s.executantesSelecionados.includes(e.value);
      });
    }
    atualizarData();
  }
}catch(e){}
window.addEventListener('error', function(e) {
  console.error('Erro no relatório:', e.error || e.message);
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</body>
</html>
