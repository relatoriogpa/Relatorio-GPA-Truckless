<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b57d0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Relatório GPA Truckless B 1.6</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#202124}
header{background:#0b57d0;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}
header h1{font-size:20px;margin:0}
header .subtitle{display:flex;justify-content:space-between;margin:5px 0 0;font-size:13px;opacity:.9}
main{max-width:720px;margin:auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #00000012}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input,select,textarea{width:100%;border:1px solid #c8ccd1;border-radius:9px;padding:11px;font-size:16px;font-family:inherit;background:#fff}
textarea{min-height:120px;resize:vertical}
button{width:100%;border:0;border-radius:10px;padding:13px;margin-top:10px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#0b57d0;color:white}.secondary{background:#e8eefc;color:#0b57d0}.danger{background:#fce8e6;color:#b3261e}
#preview{white-space:pre-wrap;line-height:1.5;font-size:15px}
.small{font-size:12px;color:#666;margin-top:8px}
.time-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#executantesBox{display:grid;grid-template-columns:1fr 1fr;gap:12px 8px;border:1px solid #c8ccd1;border-radius:9px;padding:12px;background:#fff;margin-bottom:8px}
#executantesBox label{display:flex;align-items:center;font-weight:400;margin:0;cursor:pointer}
#executantesBox input[type="checkbox"]{width:auto;margin:0 8px 0 0;cursor:pointer;transform:scale(1.1)}
</style>
</head>
<body>
<header>
<h1>Relatório de Atividade — GPA Truckless B</h1>
<div class="subtitle"><span>Versão 1.6</span><span>by Josiel Macedo</span></div>
</header>

<main>
<div class="card">
<label>Data</label>
<input id="data" type="text" readonly>

<label>Local *</label>
<select id="sistema">
<option value="">Selecione o local</option>
<option>Sistema 01</option><option>Sistema 02</option><option>Sistema 03</option>
<option>Sistema 04</option><option>BSM</option><option>Compactos</option>
<option>Pilha 01</option><option>Pilha 02</option>
</select>

<label>Equipamento *</label>
<input id="equipamento" placeholder="Ex.: TR1080KS01 / TR1082KS02 M01">

<label>Falha *</label>
<input id="falha" placeholder="Descreva a falha">

<label>OM *</label>
<input id="om" type="text" inputmode="numeric" maxlength="12"
oninput="this.value=this.value.replace(/\D/g,'')" placeholder="Exatamente 12 números">

<div class="time-row">
<div>
<label>Horário Inicial *</label>
<input id="horaInicio" type="text" inputmode="numeric" maxlength="5"
placeholder="00:00" oninput="formatarHora(this)">
</div>
<div>
<label>Horário Final *</label>
<input id="horaFim" type="text" inputmode="numeric" maxlength="5"
placeholder="00:00" oninput="formatarHora(this)">
</div>
</div>

<label>Executantes *</label>
<div id="executantesBox">
<label><input type="checkbox" name="exec" value="Anderson">Anderson</label>
<label><input type="checkbox" name="exec" value="Beatriz">Beatriz</label>
<label><input type="checkbox" name="exec" value="Danilo">Danilo</label>
<label><input type="checkbox" name="exec" value="Jarlon">Jarlon</label>
<label><input type="checkbox" name="exec" value="Josiel">Josiel</label>
<label><input type="checkbox" name="exec" value="Keyssiane">Keyssiane</label>
<label><input type="checkbox" name="exec" value="Lopes">Lopes</label>
<label><input type="checkbox" name="exec" value="Magno">Magno</label>
<label><input type="checkbox" name="exec" value="Marcelo">Marcelo</label>
<label><input type="checkbox" name="exec" value="Simenea">Simenea</label>
</div>
<input id="executanteManual" placeholder="Adicionar 1º nome manualmente (opcional)" style="margin-bottom:8px">
<input id="executanteManual2" placeholder="Adicionar 2º nome manualmente (opcional)">
</div>

<div class="card">
<label>Descrição da Ocorrência *</label>
<textarea id="ocorrencia" placeholder="Descreva o que ocorreu..."></textarea>
<label>Ações Realizadas *</label>
<textarea id="acao" placeholder="Descreva os testes, diagnóstico e serviço executado..."></textarea>
<label>Observações (Opcional)</label>
<textarea id="observacoes" placeholder="Informações adicionais (opcional)..."></textarea>
</div>

<div class="card">
<button class="primary" onclick="gerar(true)">GERAR RELATÓRIO</button>
<div id="actionButtons" style="display:none">
<button class="secondary" onclick="salvarPDF()">BAIXAR EM PDF</button>
<button class="secondary" onclick="copiar()">COPIAR TEXTO</button>
<button class="secondary" onclick="compartilharWhatsApp()">COMPARTILHAR VIA WHATSAPP</button>
<button class="secondary" onclick="compartilharEmail()">COMPARTILHAR VIA E-MAIL</button>
</div>
<button class="danger" onclick="limpar()">LIMPAR</button>
</div>

<div class="card">
<label>Pré-visualização</label>
<div id="preview">Preencha os campos e toque em “GERAR RELATÓRIO”.</div>
<div class="small">Os campos com asterisco (*) são obrigatórios.</div>
</div>
</main>

<script>
const ids=['data','sistema','equipamento','falha','om','horaInicio','horaFim','executanteManual','executanteManual2','ocorrencia','acao','observacoes'];
const $=id=>document.getElementById(id);

function formatarHora(input){
  let v=input.value.replace(/\D/g,'').slice(0,4);
  if(v.length>2)v=v.slice(0,2)+':'+v.slice(2);
  input.value=v;
}

function ocultarBotoesAcao(){
  const botoes=$('actionButtons');
  const preview=$('preview');
  if(botoes)botoes.style.display='none';
  if(preview)preview.innerHTML="<em>Modificações detectadas. Toque em 'GERAR RELATÓRIO' novamente.</em>";
}

document.querySelectorAll('input, textarea, select').forEach(el=>{
  el.addEventListener('input',ocultarBotoesAcao);
  el.addEventListener('change',ocultarBotoesAcao);
});

function dataAtualBR(){
  const d=new Date();
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
function atualizarData(){$('data').value=dataAtualBR();}

function obterExecutantesArray(){
  const nomes=[...document.querySelectorAll('input[name="exec"]:checked')].map(e=>e.value);
  const manual=$('executanteManual').value.trim();
  const manual2=$('executanteManual2').value.trim();
  if(manual)nomes.push(manual);
  if(manual2)nomes.push(manual2);
  return nomes;
}
function executantesSelecionados(){
  return obterExecutantesArray().join('; ');
}
function val(id){
  const el=$(id);
  return el ? el.value.trim() : '';
}

function calcularDuracao(hInicio,hFim){
  let [h1,m1]=hInicio.split(':').map(Number);
  let [h2,m2]=hFim.split(':').map(Number);

  // 24:00 representa 00:00 do dia seguinte.
  if(h1===24)h1=24;
  if(h2===24)h2=24;

  const inicio=h1*60+m1;
  const fim=h2*60+m2;
  let diff=fim-inicio;

  if(diff<0)diff+=1440;

  const horas=Math.floor(diff/60);
  const minutos=diff%60;
  return String(horas).padStart(2,'0')+':'+String(minutos).padStart(2,'0');
}

function validarCampos(){
  const sis=val('sistema'),eq=val('equipamento'),falha=val('falha');
  const omVal=val('om'),hInicio=val('horaInicio'),hFim=val('horaFim');
  const ocorrencia=val('ocorrencia'),acao=val('acao'),execs=obterExecutantesArray();

  if(!sis||!eq||!falha||!omVal||!hInicio||!hFim||!ocorrencia||!acao||execs.length===0){
    alert("Por favor, preencha todos os campos obrigatórios (*).");
    return false;
  }

  if(!/^\d{12}$/.test(omVal)){
    alert("O campo OM é obrigatório e deve conter exatamente 12 números.");
    $('om').focus();
    return false;
  }

  const regexHora=/^(([01]\d|2[0-3]):([0-5]\d)|24:00)$/;

  if(!regexHora.test(hInicio)){
    alert("Formato de hora inválido no campo 'Horário Inicial'. Use o formato 24:00 (ex: 08:30 ou 24:00).");
    $('horaInicio').focus();
    return false;
  }

  if(!regexHora.test(hFim)){
    alert("Formato de hora inválido no campo 'Horário Final'. Use o formato 24:00 (ex: 17:00 ou 24:00).");
    $('horaFim').focus();
    return false;
  }

  return true;
}

function escaparHTML(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function gerar(isClick=false){
  if(!validarCampos())return false;

  atualizarData();

  const duracao=calcularDuracao(val('horaInicio'),val('horaFim'));
  const obs=val('observacoes');

  const texto=
`*RELATÓRIO DE ATIVIDADE GPA TRUCKLESS B*

*Data:* ${val('data')}
*Local:* ${val('sistema')}
*Equipamento:* ${val('equipamento')}
*Falha:* ${val('falha')}
*OM:* ${val('om')}
*Horário Inicial:* ${val('horaInicio')}
*Horário Final:* ${val('horaFim')}
*Duração:* ${duracao}
*Executantes:* ${executantesSelecionados()}

*Descrição da Ocorrência:*
${val('ocorrencia')}

*Ações Realizadas:*
${val('acao')}

${obs ? `*Observações:*
${obs}` : ''}`;

Descrição da Ocorrência:
${val('ocorrencia')}

Ações Realizadas:
${val('acao')}${obs ? `

Observações:
${obs}` : ''}`;

  const preview=$('preview');
  preview.innerHTML=
    '<strong>RELATÓRIO DE ATIVIDADE GPA TRUCKLESS B</strong><br><br>'+
    '<strong>Data:</strong> '+escaparHTML(val('data'))+'<br>'+
    '<strong>Local:</strong> '+escaparHTML(val('sistema'))+'<br>'+
    '<strong>Equipamento:</strong> '+escaparHTML(val('equipamento'))+'<br>'+
    '<strong>Falha:</strong> '+escaparHTML(val('falha'))+'<br>'+
    '<strong>OM:</strong> '+escaparHTML(val('om'))+'<br>'+
    '<strong>Horário Inicial:</strong> '+escaparHTML(val('horaInicio'))+'<br>'+
    '<strong>Horário Final:</strong> '+escaparHTML(val('horaFim'))+'<br>'+
    '<strong>Duração:</strong> '+duracao+'<br>'+
    '<strong>Executantes:</strong> '+escaparHTML(executantesSelecionados())+'<br><br>'+
    '<strong>Descrição da Ocorrência:</strong><br>'+
    escaparHTML(val('ocorrencia')).replace(/\n/g,'<br>')+'<br><br>'+
    '<strong>Ações Realizadas:</strong><br>'+
    escaparHTML(val('acao')).replace(/\n/g,'<br>')+
    (obs ? '<br><br><strong>Observações:</strong><br>'+escaparHTML(obs).replace(/\n/g,'<br>') : '');

  salvarCampos();

  const botoes=$('actionButtons');
  if(botoes)botoes.style.display='block';

  return texto;
}

function salvarCampos(){
  const dados={};
  ids.forEach(id=>dados[id]=val(id));
  dados.executantesSelecionados=[...document.querySelectorAll('input[name="exec"]:checked')].map(e=>e.value);
  localStorage.setItem('relatorioGPA16B_Final',JSON.stringify(dados));
}

function salvarPDF(){
  const texto=gerar(false);
  if(!texto)return;

  if(!window.jspdf||!window.jspdf.jsPDF){
    alert('Não foi possível carregar o módulo de PDF. Verifique sua conexão com a internet e tente novamente.');
    return;
  }

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  let y=20;

  doc.setFont('helvetica','bold');
  doc.setFontSize(16);
  doc.text('RELATÓRIO DE ATIVIDADE GPA TRUCKLESS B',15,y);
  y+=10;

  doc.setFontSize(12);

  const addLinha=(label,valor)=>{
    if(y>280){doc.addPage();y=20;}
    doc.setFont('helvetica','bold');
    doc.text(label+':',15,y);
    const offset=doc.getTextWidth(label+': ');
    doc.setFont('helvetica','normal');
    const linhas=doc.splitTextToSize(String(valor),180-offset);
    doc.text(linhas,15+offset,y);
    y+=Math.max(8,linhas.length*7);
  };

  addLinha('Data',val('data'));
  addLinha('Local',val('sistema'));
  addLinha('Equipamento',val('equipamento'));
  addLinha('Falha',val('falha'));
  addLinha('OM',val('om'));
  addLinha('Horário Inicial',val('horaInicio'));
  addLinha('Horário Final',val('horaFim'));
  addLinha('Duração',calcularDuracao(val('horaInicio'),val('horaFim')));
  addLinha('Executantes',executantesSelecionados());

  const addSecao=(titulo,conteudo)=>{
    if(y>270){doc.addPage();y=20;}
    doc.setFont('helvetica','bold');
    doc.text(titulo+':',15,y);
    y+=6;
    doc.setFont('helvetica','normal');
    const linhas=doc.splitTextToSize(String(conteudo),180);
    linhas.forEach(linha=>{
      if(y>280){doc.addPage();y=20;}
      doc.text(linha,15,y);
      y+=7;
    });
    y+=4;
  };

  addSecao('Descrição da Ocorrência',val('ocorrencia'));
  addSecao('Ações Realizadas',val('acao'));
  if(val('observacoes'))addSecao('Observações',val('observacoes'));

  const nomeArquivo=`Relatorio_OM_${val('om')}_${val('data').replace(/\//g,'-')}.pdf`;
  doc.save(nomeArquivo);
}

async function copiar(){
  const texto=gerar(false);
  if(!texto)return;

  try{
    if(navigator.clipboard&&window.isSecureContext){
      await navigator.clipboard.writeText(texto);
    }else{
      const area=document.createElement('textarea');
      area.value=texto;
      area.style.position='fixed';
      area.style.left='-9999px';
      document.body.appendChild(area);
      area.focus();
      area.select();
      const ok=document.execCommand('copy');
      document.body.removeChild(area);
      if(!ok)throw new Error('Falha ao copiar');
    }
    alert('Relatório copiado com sucesso!');
  }catch(e){
    alert('Seu navegador não permitiu copiar automaticamente.');
  }
}

async function compartilharWhatsApp(){
  const texto=gerar(false);
  if(!texto)return;

  const textoCodificado=encodeURIComponent(texto);
  const url='https://wa.me/?text='+textoCodificado;

  if(navigator.share){
    try{
      await navigator.share({title:'Relatório de Atividade GPA Truckless B',text:texto});
      return;
    }catch(e){
      if(e.name==='AbortError')return;
    }
  }

  window.location.href=url;
}

function compartilharEmail(){
  const texto=gerar(false);
  if(!texto)return;

  const assunto='Relatório de Atividade GPA Truckless B - OM '+val('om');
  const url='mailto:?subject='+encodeURIComponent(assunto)+'&body='+encodeURIComponent(texto);
  window.location.href=url;
}

function limpar(){
  if(!confirm('Tem certeza que deseja limpar todos os campos?'))return;

  ids.forEach(id=>{
    const el=$(id);
    if(el)el.value='';
  });

  document.querySelectorAll('input[name="exec"]').forEach(e=>e.checked=false);
  localStorage.removeItem('relatorioGPA16B_Final');

  $('preview').innerHTML='Preencha os campos e toque em “GERAR RELATÓRIO”.';
  $('actionButtons').style.display='none';
  atualizarData();
}

atualizarData();

try{
  const s=JSON.parse(localStorage.getItem('relatorioGPA16B_Final')||'null');
  if(s){
    ids.forEach(id=>{
      if(id!=='data'&&s[id]!==undefined&&$(id))$(id).value=s[id];
    });

    if(Array.isArray(s.executantesSelecionados)){
      document.querySelectorAll('input[name="exec"]').forEach(e=>{
        e.checked=s.executantesSelecionados.includes(e.value);
      });
    }
    atualizarData();
  }
}catch(e){
  console.log('Não foi possível restaurar os dados salvos.',e);
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</body>
</html>
